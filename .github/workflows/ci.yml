name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTEST_ADDOPTS: -ra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
      - name: Install
        run: |
          python -m venv .venv
          # Same base + dev install as Makefile, with the sibling pinned for CI.
          .venv/bin/python -m pip install 'europriv-bench @ git+https://github.com/klusai/europriv-bench.git@4e1d64097ff761db0256ad4f3f523c42a071ccc4'
          .venv/bin/python -m pip install -e '.[dev]'
          # Existing unit tests import these directly; no HF training stack needed.
          .venv/bin/python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install 'datasets>=4.0'
      - name: Lint and tests
        # Makefile uses `source`; Ubuntu's default /bin/sh does not support it.
        run: make SHELL=/bin/bash check
